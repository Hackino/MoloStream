name: Set up Android build environment
description: Provisions JDK 17 (Temurin) and Gradle with caching for Android builds.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: "17"
  java-distribution:
    description: JDK distribution to install.
    required: false
    default: temurin

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
